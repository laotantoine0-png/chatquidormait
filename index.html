<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un gros chat dormait</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Typographie sobre : Arial, comme le jeu du furet -->

    
    <style>
        :root {
            --bg-paper: #FAF6EE;
            --navy-title: #2D466B;
            --blue-card: #3685CE;
            --blue-card-border: #2568A8;
            --blue-card-inner: #5BA3E6;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-paper);
            /* Texture papier grain léger inspirée de la maquette */
            background-image: 
                radial-gradient(rgba(160, 145, 120, 0.09) 1px, transparent 0),
                radial-gradient(rgba(160, 145, 120, 0.06) 1px, transparent 0);
            background-size: 26px 26px;
            background-position: 0 0, 13px 13px;
            color: var(--navy-title);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-album {
            font-family: Arial, sans-serif;
        }

        /* Intégration transparente du fond blanc de l'illustration retouchée du chat */
        .cat-illustration {
            mix-blend-mode: multiply;
            pointer-events: none;
            filter: contrast(1.03);
        }

        /* Grand cadre sobre en haut à droite : bordure noire, fond blanc */
        .target-blue-box {
            background-color: #FFFFFF;
            border: 5px solid #000000;
            border-radius: 32px;
        }

        .target-digit-stroke {
            font-family: Arial, sans-serif;
            font-weight: 700;
            color: #000000;
        }

        #target-number {
            display: inline-block;
            min-width: .8em;
            text-align: center;
        }


        /* Zone de dépôt interactive sur le dos du chat */
        .cat-back-zone {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cat-back-zone.drag-over {
            background-color: rgba(54, 133, 206, 0.16);
            border-color: #3685CE;
            transform: scale(1.02);
        }


        #cat-back-dropzone {
            overflow: hidden;
            box-sizing: border-box;
        }

        #mice-on-cat-container {
            min-width: 0;
            align-items: flex-end;
            justify-content: space-evenly;
            gap: 0;
            padding-left: 2px;
            padding-right: 2px;
        }

        #mice-on-cat-container .mouse-token {
            flex: 1 1 0;
            min-width: 0;
            max-width: 20%;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        #mice-on-cat-container .mouse-token img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /* Petit repère pour retirer facilement une souris du dos */
        #mice-on-cat-container .mouse-token {
            position: relative;
            cursor: pointer;
            overflow: visible;
        }

        .mouse-remove-mark {
            position: absolute;
            top: 0;
            right: 0;
            width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: #FFFFFF;
            color: #B34242;
            border: 1.5px solid #B34242;
            font: 800 15px/1 Arial, sans-serif;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
            opacity: .92;
            pointer-events: none;
        }

        /* Cercles d'attente des souris */
        .mouse-circle-slot {
            border: 3px solid #2D466B;
            background-color: rgba(255, 253, 248, 0.75);
            box-shadow: inset 0 2px 5px rgba(45, 70, 107, 0.08);
            transition: all 0.25s ease;
        }

        /* Souris interactives */
        .mouse-token {
            cursor: grab;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            touch-action: none;
        }

        .mouse-token:hover {
            transform: translateY(-5px) scale(1.07);
            filter: drop-shadow(0 6px 8px rgba(45, 70, 107, 0.18));
        }

        .mouse-token:active {
            cursor: grabbing;
            transform: scale(0.95);
        }


        /* Animations douces */
        @keyframes hopOnCat {
            0% { transform: translateY(24px) scale(0.65); opacity: 0; }
            65% { transform: translateY(-8px) scale(1.08); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .animate-hop {
            animation: hopOnCat 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes catSleep {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.014); }
        }

        .cat-breathing {
            transform-origin: bottom center;
            animation: catSleep 4.5s ease-in-out infinite;
        }

        @keyframes popNumber {
            0% { transform: scale(0.6) rotate(-5deg); }
            70% { transform: scale(1.1) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-pop-number {
            animation: popNumber 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes floatZzz {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translate(16px, -28px) scale(1.2); opacity: 0; }
        }
        .zzz-1 { animation: floatZzz 3.6s infinite ease-out; }
        .zzz-2 { animation: floatZzz 3.6s infinite ease-out 1.8s; }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between px-3 py-3 sm:px-6 sm:py-5 relative">

    <!-- Canevas pour les confettis de célébration -->
    <canvas id="confetti-canvas"></canvas>

    <!-- CONTENEUR PRINCIPAL EN 2 COLONNES SUR ÉCRAN LARGE (fidèle à la maquette) -->
    <div class="w-full max-w-6xl mx-auto my-auto grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-center">
        
        <!-- COLONNE GAUCHE (7/12) : Titre "UN GROS CHAT DORMAIT" + Illustration du gros chat gris retouché -->
        <section class="lg:col-span-7 flex flex-col justify-between items-center lg:items-start">
            
            <!-- En-tête gauche avec titre sur 2 lignes + bouton son -->
            <div class="w-full flex items-start justify-between lg:justify-start gap-3 mb-2 sm:mb-3">
                <div class="flex-1 min-w-0">
                    <h1 class="font-album text-2xl sm:text-3xl xl:text-[38px] font-bold leading-[1.08] text-[#2D466B] text-center lg:text-left">
                        Un gros chat<br>dormait

                    <p id="instruction-title"
                        class="text-sm sm:text-base font-bold text-[#2D466B] text-center lg:text-left mt-1 sm:mt-2 px-2 sm:px-0">
                        Touche ou glisse les souris sur le dos du gros chat !
                    </p>
                </div>

                <!-- Bouton son (effets sonores du jeu) -->
                <div class="flex items-center gap-2 shrink-0 mt-1">
                    <button id="sound-toggle" aria-label="Activer ou couper le son"
                        class="p-2.5 rounded-2xl bg-white/90 hover:bg-white border-2 border-[#2D466B]/20 text-[#2D466B] shadow-sm transition active:scale-95"
                        title="Son activé">
                        <svg id="icon-sound-on" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
                        </svg>
                        <svg id="icon-sound-off" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Scène du gros chat gris retouché (watermarked_img_5399799136408226932.jpg) -->
            <div id="cat-stage" class="relative w-full max-w-[680px] aspect-[16/9] flex items-end justify-center mt-1 sm:mt-2">
                
                <!-- Petits Zzz de sommeil au-dessus de la tête du chat -->
                <div id="zzz-indicator" class="absolute right-[13%] top-[15%] font-album font-bold text-[#2D466B]/50 pointer-events-none select-none z-10">
                    <span class="zzz-1 inline-block text-xl sm:text-2xl">z</span>
                    <span class="zzz-2 inline-block text-2xl sm:text-3xl ml-1">Z</span>
                </div>

                <!-- ZONE INTERACTIVE SUR LE DOS DU CHAT (épouse la courbe du dos de gauche à droite) -->
                <div id="cat-back-dropzone"
                    aria-label="Dos du gros chat gris"
                    class="cat-back-zone absolute left-[6%] top-[9%] w-[57%] h-[38%] rounded-[42px] border-2 border-dashed border-[#2D466B]/30 flex items-end justify-center px-1 sm:px-3 pb-1 z-20">
                    
                    <!-- Les souris placées sur le dos s'alignent ici de gauche à droite -->

        // État global du jeu
        const state = {
            targetNumber: 5,
            miceOnCat: [], // IDs des souris actuellement sur le dos du chat
            soundEnabled: true,
            isCelebrating: false,
            draggedMouseId: null
        };

        // Références DOM
        const targetNumberEl = document.getElementById('target-number');
        const targetFrameEl = document.getElementById('target-frame');
        const miceReserveEl = document.getElementById('mice-reserve');
        const miceOnCatEl = document.getElementById('mice-on-cat-container');
        const dropzoneEl = document.getElementById('cat-back-dropzone');
        const feedbackBannerEl = document.getElementById('feedback-banner');
        const feedbackIconEl = document.getElementById('feedback-icon');
        const btnVerify = document.getElementById('btn-verify');
        const btnNew = document.getElementById('btn-new');
        const soundToggleBtn = document.getElementById('sound-toggle');

        const catSleepImgEl = document.getElementById('cat-image');
        const catAwakeImgEl = document.getElementById('cat-image-awake');
        const catGrumpyImgEl = document.getElementById('cat-image-grumpy');
        const zzzIndicatorEl = document.getElementById('zzz-indicator');

        /**
         * États du chat : 'sleep' (endormi, respiration animée), 'still' (endormi, immobile),
         * 'awake' (victoire), 'grumpy' (échec). Les 3 images sont superposées au même endroit.
         */
        function setCatState(mode) {
            const sleeping = (mode === 'sleep' || mode === 'still');
            catSleepImgEl.classList.toggle('hidden', !sleeping);
            catSleepImgEl.classList.toggle('cat-breathing', mode === 'sleep');
            catAwakeImgEl.classList.toggle('hidden', mode !== 'awake');
            catGrumpyImgEl.classList.toggle('hidden', mode !== 'grumpy');
            zzzIndicatorEl.classList.toggle('hidden', !sleeping);
        }

        // Synthétiseur audio doux (Web Audio API) pour les effets sonores du jeu
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

        const sampleCache = {};
        function playSample(key, src) {
            try {
                if (!sampleCache[key]) {
                    sampleCache[key] = new Audio(src);
                    sampleCache[key].preload = 'auto';
                }
                sampleCache[key].currentTime = 0;
                sampleCache[key].play().catch(() => {});
            } catch (e) {
                // Ignorer si audio bloqué
            }
        }
        function playMeow() { playSample('meow', MEOW_SRC); }
        function playHiss() { playSample('hiss', HISS_SRC); }

        function playTone(type) {
            if (!state.soundEnabled) return;
            if (type === 'success') { playMeow(); return; }   // victoire : miaulement
            if (type === 'encourage') { playHiss(); return; } // échec : feulement
            try {
                initAudio();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;

                if (type === 'hop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(360, now);
                    osc.frequency.exponentialRampToValueAtTime(640, now + 0.14);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'down') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(280, now + 0.14);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                }
            } catch (e) {
                // Ignorer si audio bloqué
            }
        }

        /**
         * Génère le SVG texturé style album jeunesse d'une petite souris
         */
        function createMouseSVG(mouse, sizeClass = 'w-14 h-14 sm:w-16 sm:h-16') {
            return `<img src="${mouse.image}" alt="${mouse.name}"
                draggable="false"
                class="${sizeClass} object-contain pointer-events-none select-none"
                style="max-width:100%;"
            />`;
        }

        /**
         * Affiche une bannière de retour visuel
         */
        function showFeedback(text, type = 'info') {
            // Succès : 😊 — Échec : 😟 (mêmes emojis que le jeu de la fusée)
            feedbackIconEl.textContent = (type === 'success') ? '😊' : '😟';
            feedbackBannerEl.setAttribute('aria-label', text);
            feedbackBannerEl.classList.remove('opacity-0');
            feedbackBannerEl.classList.add('opacity-100');
        }

        function hideFeedback() {
            feedbackBannerEl.classList.remove('opacity-100');
            feedbackBannerEl.classList.add('opacity-0');
            feedbackIconEl.textContent = '';
        }

        /**
         * Met à jour tout l'affichage : dos du chat, 5 cercles de réserve, 5 boutons chiffres
         */
        function renderGame() {
            const count = state.miceOnCat.length;

            // 1. Rendu des souris alignées de gauche à droite le long de la courbe du dos du chat
            miceOnCatEl.innerHTML = '';
            const curveOffsets = [2, -5, 2, 6, 1]; // Épouse la courbe du dos du chat gris
            state.miceOnCat.forEach((mouseId, index) => {
                const mouse = MICE_DATA.find(m => m.id === mouseId);
                if (!mouse) return;

                const el = document.createElement('button');
                el.type = 'button';
                el.setAttribute('aria-label', `Faire descendre ${mouse.name}`);
                el.title = 'Touche pour faire redescendre la souris';
                el.className = 'mouse-token animate-hop relative flex flex-col items-center focus:outline-none';
                el.style.marginBottom = `${curveOffsets[index % curveOffsets.length]}px`;
                el.innerHTML = createMouseSVG(mouse, 'w-9 h-12 sm:w-11 sm:h-14 md:w-12 md:h-[68px]') +
                    '<span class="mouse-remove-mark" aria-hidden="true">×</span>';

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (state.isCelebrating) return;
                    removeMouseFromCat(mouse.id);
                });

                miceOnCatEl.appendChild(el);
            });

            // 4. Rendu des 5 cercles emplacements pour les souris en attente
            miceReserveEl.innerHTML = '';
            MICE_DATA.forEach(mouse => {
                const isOnCat = state.miceOnCat.includes(mouse.id);
                const circleSlot = document.createElement('div');
                circleSlot.className = 'mouse-circle-slot w-14 h-14 sm:w-16 sm:h-16 md:w-[74px] md:h-[74px] rounded-full flex items-center justify-center relative';

                if (!isOnCat) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.draggable = true;
                    btn.setAttribute('aria-label', `Mettre ${mouse.name} sur le dos du chat`);
                    btn.className = 'mouse-token flex items-center justify-center focus:outline-none w-full h-full';
                    btn.innerHTML = createMouseSVG(mouse, 'w-11 h-11 sm:w-13 sm:h-13 md:w-14 md:h-14');

                    // Clic / Tap -> monte sur le dos du chat
                    btn.addEventListener('click', () => {
                        if (state.isCelebrating) return;
                        addMouseToCat(mouse.id);
                    });

                    // Glisser-déposer souris (Desktop)
                    btn.addEventListener('dragstart', (e) => {
                        state.draggedMouseId = mouse.id;
                        if (e.dataTransfer) {
                            e.dataTransfer.setData('text/plain', String(mouse.id));
                            e.dataTransfer.effectAllowed = 'move';
                        }
                    });

                    btn.addEventListener('dragend', () => {
                        state.draggedMouseId = null;
                        dropzoneEl.classList.remove('drag-over');
                    });

                    // Glisser tactile (Mobile / Tablette)
                    setupTouchDrag(btn, mouse.id);

                    circleSlot.appendChild(btn);
                }

                miceReserveEl.appendChild(circleSlot);
            });

        }

        /**
         * Gestion fluide du glisser tactile sur mobile / tablette
         */
        function setupTouchDrag(element, mouseId) {
            let startX = 0;
            let startY = 0;
            let isDragging = false;

            element.addEventListener('touchstart', (e) => {
                if (state.isCelebrating) return;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = false;
            }, { passive: true });

            element.addEventListener('touchmove', (e) => {
                if (state.isCelebrating) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;

                if (Math.hypot(dx, dy) > 12) {
                    isDragging = true;
                    element.style.transform = `translate(${dx}px, ${dy}px) scale(1.12)`;
                    element.style.zIndex = '40';

                    const dropRect = dropzoneEl.getBoundingClientRect();
                    if (
                        touch.clientX >= dropRect.left &&
                        touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top &&
                        touch.clientY <= dropRect.bottom
                    ) {
                        dropzoneEl.classList.add('drag-over');
                    } else {
                        dropzoneEl.classList.remove('drag-over');
                    }
                }
            }, { passive: true });

            element.addEventListener('touchend', (e) => {
                element.style.transform = '';
                element.style.zIndex = '';
                dropzoneEl.classList.remove('drag-over');

                if (isDragging && e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    const dropRect = dropzoneEl.getBoundingClientRect();
                    if (
                        touch.clientX >= dropRect.left &&
                        touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top &&
                        touch.clientY <= dropRect.bottom
                    ) {
                        addMouseToCat(mouseId);
                    }
                }
            });
        }

        function addMouseToCat(mouseId) {
            if (state.miceOnCat.includes(mouseId) || state.miceOnCat.length >= 5) return;
            state.miceOnCat.push(mouseId);
            playTone('hop');
            hideFeedback();
            setCatState('sleep');
            renderGame();
        }

        function removeMouseFromCat(mouseId) {
            state.miceOnCat = state.miceOnCat.filter(id => id !== mouseId);
            playTone('down');
            hideFeedback();
            setCatState('sleep');
            renderGame();
        }

        /**
         * Génère un nouveau chiffre aléatoire entre 1 et 5
         */
        function startNewRound() {
            state.isCelebrating = false;
            state.miceOnCat = [];
            hideFeedback();
            setCatState('sleep');

            let nextNum;
            do {
                nextNum = Math.floor(Math.random() * 5) + 1;
            } while (nextNum === state.targetNumber);

            state.targetNumber = nextNum;
            targetNumberEl.textContent = state.targetNumber;

            targetFrameEl.classList.remove('animate-pop-number');
            void targetFrameEl.offsetWidth;
            targetFrameEl.classList.add('animate-pop-number');

            renderGame();
        }

        /**
         * Vérifie si le nombre de souris sur le dos correspond au chiffre dans le grand cadre bleu
         */
        function checkAnswer() {
            setCatState('still');
            if (state.isCelebrating) return;
            const count = state.miceOnCat.length;

            if (count === state.targetNumber) {
                state.isCelebrating = true;
                playTone('success');
                const msg = `Bravo ! Tu as bien compté ${count} souris sur le dos du gros chat !`;
                showFeedback(msg, 'success');
                launchConfetti();
                setCatState('awake');

                setTimeout(() => {
                    startNewRound();
                }, 2800);
            } else {
                playTone('encourage');
                const msg = count === 0
                    ? `Mets ${state.targetNumber} souris sur le dos du gros chat !`
                    : `Encore un effort ! Tu en as mis ${count}, il en faut ${state.targetNumber}.`;
                showFeedback(msg, 'encourage');
                setCatState('grumpy');
            }
        }

        // Zone de dépôt Drag & Drop HTML5
        dropzoneEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzoneEl.classList.add('drag-over');
        });

        dropzoneEl.addEventListener('dragleave', () => {
            dropzoneEl.classList.remove('drag-over');
        });

        dropzoneEl.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzoneEl.classList.remove('drag-over');
            if (state.isCelebrating) return;

            const rawId = e.dataTransfer ? e.dataTransfer.getData('text/plain') : null;
            const mouseId = rawId ? parseInt(rawId, 10) : state.draggedMouseId;
            if (mouseId) {
                addMouseToCat(mouseId);
            }
        });

        // Événements des boutons principaux
        btnVerify.addEventListener('click', checkAnswer);
        btnNew.addEventListener('click', () => {
            playTone('hop');
            startNewRound();
        });

        soundToggleBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !state.soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', state.soundEnabled);
            if (state.soundEnabled) {
                playTone('hop');
            }
        });

        /**
         * Confettis colorés de félicitations
         */
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimId = null;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        function launchConfetti() {
            const colors = ['#3685CE', '#48B3B8', '#49A868', '#E35B44', '#F08094', '#F4C44E'];
            confettiParticles = [];

            for (let i = 0; i < 90; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: -20 - Math.random() * 150,
                    size: 7 + Math.random() * 7,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 4,
                    vy: 2.5 + Math.random() * 4,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 8
                });
            }

            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;

            confettiParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;

                if (p.y < confettiCanvas.height + 20) {
                    active = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.roundRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65, 3);
                    ctx.fill();
                    ctx.restore();
                }
            });

            if (active) {
                confettiAnimId = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        // Initialisation au chargement
        window.addEventListener('DOMContentLoaded', () => {
            state.targetNumber = Math.floor(Math.random() * 5) + 1;
            targetNumberEl.textContent = state.targetNumber;
            renderGame();
        });
    </script>
</body>
